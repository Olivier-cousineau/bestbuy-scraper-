name: BestBuy - Scrap, Clean & Publish to econoplus

on:
  schedule:
    # GitHub Actions utilise UTC. On déclenche à 18:00 et 19:00 UTC,
    # puis on filtre en heure locale du Québec (America/Toronto) pour
    # exécuter seulement à 14:00 les mardis, jeudis et samedis.
    - cron: "0 18 * * 2,4,6"
    - cron: "0 19 * * 2,4,6"
  workflow_dispatch:

jobs:
  scrape-clean-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate Quebec schedule window
        id: schedule_check
        env:
          TZ: America/Toronto
        run: |
          local_day=$(date +%u)
          local_hour=$(date +%H)

          if { [ "$local_day" = "2" ] || [ "$local_day" = "4" ] || [ "$local_day" = "6" ]; } \
            && [ "$local_hour" = "14" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Run approved for Quebec schedule."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run: not 14:00 on Tuesday, Thursday, or Saturday in Quebec."
          fi

      - name: Checkout bestbuy-scraper repo
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers (Chromium)
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Run BestBuy scroll scraper
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          PYTHONPATH: src
        run: |
          python -m bestbuy_scraper.scroll_scraper \
            --output data/clearance_products_full.json \
            --html data/clearance_page.html

      - name: Clean BestBuy clearance JSON
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          PYTHONPATH: src
        run: |
          python -m bestbuy_scraper.clean_bestbuy_clearance \
            --input data/clearance_products_full.json \
            --output outputs/bestbuy/clearance.json

      - name: Checkout econoplus
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          repository: Olivier-cousineau/econoplus
          ref: main
          token: ${{ secrets.ECONOPLUS }}
          path: econoplus
          fetch-depth: 0

      - name: Sync econoplus main
        if: steps.schedule_check.outputs.should_run == 'true'
        working-directory: econoplus
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Copier clearance.json brut vers econoplus
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          mkdir -p econoplus/outputs/bestbuy
          cp data/clearance_products_full.json econoplus/outputs/bestbuy/clearance.json

      - name: Copy BestBuy online.json to econoplus
        if: steps.schedule_check.outputs.should_run == 'true'
        run: |
          set -e
          mkdir -p econoplus/public/bestbuy
          cp outputs/bestbuy/clearance.json econoplus/public/bestbuy/online.json

      - name: Commit & push to econoplus
        if: steps.schedule_check.outputs.should_run == 'true'
        working-directory: econoplus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --porcelain
          if git status --porcelain | grep -q .; then
            git add outputs/bestbuy public/bestbuy
            git commit -m "BestBuy: update online.json"
            git push origin main
          else
            echo "No changes to commit"
          fi
